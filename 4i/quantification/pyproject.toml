[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myonis-fouri-quantification"
version = "0.1.0"
description = "Linked nuclear, myotube and substructure measurements for MYONIS 4i"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11", "scikit-image>=0.22",
  "shapely>=2", "anndata>=0.10,<0.13", "h5py>=3.10", "tifffile>=2023.9",
  "PyYAML>=6", "imageio>=2.31", "Pillow>=10", "reportlab>=4", "matplotlib>=3.8", "tqdm>=4.60"
]

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=4"]

[project.scripts]
fouri-quantify = "fouri_quantification.cli:main"
fouri-nucleus-qc = "fouri_quantification.qc.run_4i_nucleus_segmentation_qc:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fouri_quantification = ["compatibility/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
