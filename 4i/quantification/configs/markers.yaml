# Marker keys are stable feature-name prefixes. Paths belong in dataset.yaml.
include_dapi: true  # Quantify only segmentations.nuclei.acquisition_id; all rounds still support QC.
markers:
  emyhc:
    acquisition_id: measurement_01_488_emyhc
    # Image measurements in reference nuclei and MyHC-derived myotube masks.
    nuclear_compartments: [whole_nucleus]
    myotube_compartments: [whole_myotube, cytoplasm]
  lamin_a_c:
    acquisition_id: measurement_01_555_lamin_a_c
    nuclear_compartments: [whole_nucleus, nuclear_rim, nuclear_interior]
  53bp1:
    acquisition_id: measurement_01_647_53bp1
    structure_source: "53bp1"
    structure_parent: nucleus
    structure_overlap_threshold: 0.8
