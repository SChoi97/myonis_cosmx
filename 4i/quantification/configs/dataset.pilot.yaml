  acquisition_id: null
  prediction_directories: []
  ensemble: mean
texture:
  enabled: true
  levels: 32
  distances_px:
  - 1
  - 3
  min_pixels: 16
  min_pairs: 16
  fallback_range:
  - 0
  - 65535
execution:
