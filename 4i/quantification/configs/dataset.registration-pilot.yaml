# One real round-2 reference field: integrated registration/SSIM QC, then quantitative feature extraction.
schema_version: 1
dataset_id: 4i_test_20260825
preprocessing:
  root: ../../preprocessing/results/test_runs/4i_patch_level_test_20260825_102029_f6ecb24
  image_manifest: manifests/aggregate/patch_manifest.csv
  display_manifest: manifests/aggregate/clipping_manifest.csv
marker_config: markers.yaml
plate_layout: plate_layout.yaml
output_root: ../results
selection:
  cohorts:
  - m01_08
  plates:
  - sc_rep5-6
  wells:
  - r04c02
  fields:
  - 1
  max_fields: 1
  field_sampling: first
  field_seed: 0
measurement:
  overlap_policy: include
geometry:
  pixel_size_um: null
  merge_patch_objects: false
  rim_width_px: 2
  perinuclear_width_px: 4
  edge_threshold: 0
segmentations:
  format: yolov8_seg
  pattern: '*.txt'
  nuclei:
    segmentation_id: myonis_v2_nuclei_r02
    acquisition_id: measurement_02_dapi
    directory: segmentation/multiround_nuclei/dapi_r2/4i_phenix_myonis_segmentation_nuclei_r2/02_nuclei_deduplication/contours
  myotubes:
    segmentation_id: myonis_v2_myotubes_r02
    acquisition_id: measurement_02_555_myhc
    directory: myonis_out_v2/4i_phenix_myonis_segmentation/10_myotube_segmentation/contours
  structures:
    53bp1:
      segmentation_id: 53bp1_v1
      acquisition_id: measurement_01_647_53bp1
      directory: null
    baf:
      segmentation_id: baf_v1
      acquisition_id: measurement_03_647_baf
      directory: null
    sc35:
      segmentation_id: sc35_v1
      acquisition_id: measurement_05_555_sc35
      directory: null
    cgas:
      segmentation_id: cgas_v1
      acquisition_id: measurement_06_647_cgas
      directory: null
nucleus_myotube_assignment:
  overlap_threshold: 0.8
registration_qc:
  enabled: true
  fast_mode: true
  metric: ssim
  threshold: 0.35
  aggregation: max
  smoothing_sigma_px: 1.0
  min_valid_fraction: 0.9
  local_window: 11
  texture_floor: 0.01
  comparison_gain_limits:
  - 0.01
  - 100.0
  compare_metrics: false
  registration_config: null
  tools_dir: null
nucleus_qc:
  directory: null
  require_all: false
myhc_filter:
  enabled: false
  metadata_csv: null
  intensity_threshold: 15
nuclear_aberration:
  enabled: false
  acquisition_id: null
  prediction_directories: []
  ensemble: mean
texture:
  enabled: true
  levels: 32
  distances_px:
  - 1
  - 3
  min_pixels: 16
  min_pairs: 16
  fallback_range:
  - 0
  - 65535
execution:
  troubleshoot: false        # --troubleshoot / --optimise: full diagnostics for sampled fields.
  troubleshoot_timing: false # --troubleshoot_timing: timings only, no extra figures.
  workers: 1
  allow_partial: false
  hash_inputs: true
visualisation:
  max_fields: 100           # Random visualisation fields ONLY; does not limit quantification. 0 = none.
  field_seed: 0             # Reproducible selection independent of selection.field_seed.
  export_audits: false      # --troubleshoot enables TSV/JSON audits and masks for sampled fields.
  enabled: true
  markers:
  - dapi_r02
  - myhc
  - emyhc
  - sc35
  max_patches_per_field: 1
  dpi: 120
  max_labels_per_panel: 40
  export_masks: false
outputs:
  pdf: true
  qc_overlays: 0
  object_h5ad: false
