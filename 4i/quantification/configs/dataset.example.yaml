# Copy this file before changing it. Relative asset paths use preprocessing.root.
# Configuration references and output_root are relative to this YAML file.
schema_version: 1
dataset_id: 4i_test_20260825
preprocessing:
  root: ../../preprocessing/results/test_runs/4i_patch_level_test_20260825_102029_f6ecb24
  image_manifest: manifests/aggregate/patch_manifest.csv
  display_manifest: manifests/aggregate/clipping_manifest.csv
marker_config: markers.yaml
plate_layout: plate_layout.yaml
output_root: ../results
selection:
  cohorts: [m01_08]
  plates: all
  wells: all
  fields: all
  max_fields: 50             # Global field/cohort limit after filters; null = all.
  field_sampling: random    # random (reproducible) or first (sorted IDs).
  field_seed: 0
measurement:
  overlap_policy: include  # include = shared pixels measured in each object; exclude = remove from all peers.
  # Applies separately to nuclei, myotubes and structures of the same source, within each patch.
  # Intensity, texture and sigmoid masks change; original morphology, IDs and parent/count assignments do not.
geometry:
  pixel_size_um: null
  merge_patch_objects: false
  rim_width_px: 2
  perinuclear_width_px: 4
  edge_threshold: 0
segmentations:
  format: yolov8_seg
  pattern: '*.txt'
  nuclei:
    segmentation_id: myonis_v2_nuclei_r02
    acquisition_id: measurement_02_dapi
    directory: segmentation/multiround_nuclei/dapi_r2/4i_phenix_myonis_segmentation_nuclei_r2/02_nuclei_deduplication/contours
  myotubes:
    segmentation_id: myonis_v2_myotubes_r02
    acquisition_id: measurement_02_555_myhc
    directory: myonis_out_v2/4i_phenix_myonis_segmentation/10_myotube_segmentation/contours
  structures:
    # eMYHC is measured as an image marker; MyHC supplies the myotube masks above.
    "53bp1":
      segmentation_id: 53bp1_v1
      acquisition_id: measurement_01_647_53bp1
      directory: null
    baf:
      segmentation_id: baf_v1
      acquisition_id: measurement_03_647_baf
      directory: null
    sc35:
      segmentation_id: sc35_v1
      acquisition_id: measurement_05_555_sc35
      directory: null
    cgas:
      segmentation_id: cgas_v1
      acquisition_id: measurement_06_647_cgas
      directory: null
nucleus_myotube_assignment:
  overlap_threshold: 0.8
registration_qc:
  enabled: true             # Step 1 in each field worker, before any quantification.
  fast_mode: true           # Skip QC figures/dense maps; KEEP registration, scoring and transforms.
  metric: ssim              # ssim, relative, relative_calibrated, pixel_max, pixel_mean, zncc_signal, gradient.
  threshold: 0.35           # Keep when area-mean change score <= threshold; not an SSIM similarity cutoff.
  aggregation: max          # Pixelwise max/mean across other rounds, then mean within each nucleus.
  smoothing_sigma_px: 1.0
  min_valid_fraction: 0.90
  local_window: 11          # Odd local SSIM window size.
  texture_floor: 0.01
  comparison_gain_limits: [0.01, 100.0]
  compare_metrics: false   # Optional exploratory comparisons; main flags still use metric above.
  registration_config: null  # Run provenance/pipeline_config.json, otherwise preprocessing/config/pipeline_config.json.
  tools_dir: null           # Auto-detect computational_tools; override if installed outside this checkout.
  # Reference round comes from segmentations.nuclei.acquisition_id, never a second independent setting.
  # Same patch/round transform is applied to ALL channels and their contours before parent assignment.
nucleus_qc:
  directory: null           # External QC import only; leave null when registration_qc.enabled is true.
  require_all: false        # true requires completed QC for every selected reference patch.
  # Metadata only: quantify all original nuclei. Missing/unevaluable persistence stays unknown.
  # QC must use this YAML's nucleus reference round AND identical original contour files.
myhc_filter:
  enabled: false
  metadata_csv: null
  intensity_threshold: 15
nuclear_aberration:
  enabled: false
  acquisition_id: null
  prediction_directories: []
  ensemble: mean
texture:
  enabled: true
  levels: 32
  distances_px: [1, 3]
  min_pixels: 16
  min_pairs: 16
  fallback_range: [0, 65535]
execution:
  troubleshoot: false        # --troubleshoot / --optimise: full diagnostics for sampled fields.
  troubleshoot_timing: false # --troubleshoot_timing: timings only, no extra figures.
  workers: 4
  allow_partial: false
  hash_inputs: true
visualisation:
  max_fields: 100           # Random visualisation fields ONLY; does not limit quantification. 0 = none.
  field_seed: 0             # Reproducible selection independent of selection.field_seed.
  export_audits: false      # --troubleshoot enables TSV/JSON audits and masks for sampled fields.
  enabled: true             # Uses local MYONIS-VisTools via the direct launcher.
  markers: all              # Or [myhc, sc35, 53bp1, baf, cgas, emyhc, lamin_a_c].
  max_patches_per_field: 1  # null = all patches in each sampled visualisation field.
  dpi: 120
  max_labels_per_panel: 40  # Label cap only; all objects remain in the H5AD.
  export_masks: false        # Optional exact ROI exports; --troubleshoot enables these.
outputs:
  pdf: true
  qc_overlays: 0            # Older single-patch overview; detailed QC is above.
  object_h5ad: false
